<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0; padding: 0; font-family: "Open Sans", Arial, sans-serif;
      background: #0C4478; color: #fff; -webkit-app-region: drag;
      border-radius: 10px; overflow: hidden;
    }
    .wrap { padding: 14px; }
    h2 { margin: 0 0 4px 0; font-size: 14px; font-family: "Montserrat", Arial, sans-serif; }
    .status { font-size: 12px; opacity: 0.85; margin-bottom: 10px; }
    .status.paused { color: #FFC93C; }
    .counter { font-size: 28px; font-weight: 800; margin-bottom: 12px; }
    .counter span { font-size: 13px; font-weight: 400; opacity: 0.8; }
    .btns { display: flex; gap: 8px; -webkit-app-region: no-drag; }
    button {
      flex: 1; border: none; border-radius: 8px; padding: 8px 0;
      font-weight: 700; cursor: pointer; font-size: 13px;
    }
    #btnPause { background: #D97706; color: #fff; }
    #btnStop { background: #DC2626; color: #fff; }
    .hint { font-size: 11px; opacity: 0.7; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>CAPIT — grabando</h2>
    <div class="status" id="status">Grabando actividad...</div>
    <div class="counter"><span id="count">0</span> <span>pasos capturados</span></div>
    <div class="btns">
      <button id="btnPause">Pausar</button>
      <button id="btnStop">Detener</button>
    </div>
    <div class="hint">Atajo para detener: Ctrl+Shift+S</div>
  </div>
  <script src="js/control-panel.js"></script>
</body>
</html>
