<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    html, body { margin: 0; padding: 0; background: rgba(12,68,120,0.15); cursor: crosshair; overflow: hidden; }
    #selection {
      position: absolute;
      border: 3px dashed #185FA5;
      background: rgba(24,95,165,0.12);
      display: none;
    }
    #hint {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: #0C4478; color: #fff; padding: 8px 16px; border-radius: 8px;
      font-family: Arial, sans-serif; font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="hint">Arrastra para marcar el area a grabar — Esc para cancelar</div>
  <div id="selection"></div>
  <script src="js/area-select.js"></script>
</body>
</html>
