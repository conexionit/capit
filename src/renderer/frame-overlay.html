<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    .frame {
      position: absolute;
      inset: 0;
      border: 4px solid #185FA5;
      box-sizing: border-box;
      border-radius: 4px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.4) inset;
    }
    .badge {
      position: absolute;
      top: -14px;
      left: 12px;
      background: #185FA5;
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="frame"><span class="badge">CAPIT — grabando</span></div>
</body>
</html>
